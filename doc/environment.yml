name: adel
channels:
  - openalea3/label/dev
  - openalea3/label/rc
  - openalea3
  - conda-forge
dependencies:
  - numpy
  - scipy
  - matplotlib
  - pandas
  - rpy2
  - openalea.mtg
  - openalea.widgets
  - openalea.plantgl
  - openalea.core >= 2.4
  - pydata-sphinx-theme
  - sphinx-favicon
  - nbsphinx
  - nbsphinx-link
  - myst-parser
  - sphinx-copybutton
  - pip
  - pip:
      - -e ..
